services:
  cognee-mcp:
    image: ${COGNEE_MCP_IMAGE:-cognee/cognee-mcp@sha256:43030dd7aef73ef83f8b7a64c280b8ee15a4f6a37a057dc06b150a46ec27ae33}
    profiles: [cognee]
    restart: unless-stopped
    environment:
      TRANSPORT_MODE: http
      LLM_PROVIDER: ${COGNEE_LLM_PROVIDER:-openai}
      LLM_MODEL: ${COGNEE_LLM_MODEL:-openai/gpt-4o-mini}
      LLM_ENDPOINT: ${COGNEE_LLM_ENDPOINT:-}
      LLM_API_KEY: ${COGNEE_LLM_API_KEY:?Set COGNEE_LLM_API_KEY in .env or Grimoire}
      EMBEDDING_PROVIDER: ${COGNEE_EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${COGNEE_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      EMBEDDING_ENDPOINT: ${COGNEE_EMBEDDING_ENDPOINT:-}
      EMBEDDING_API_KEY: ${COGNEE_EMBEDDING_API_KEY:-${COGNEE_LLM_API_KEY}}
      EMBEDDING_DIMENSIONS: ${COGNEE_EMBEDDING_DIMENSIONS:-1536}
      DATA_ROOT_DIRECTORY: /cognee-storage/data
      SYSTEM_ROOT_DIRECTORY: /cognee-storage/system
      TELEMETRY_DISABLED: ${COGNEE_TELEMETRY_DISABLED:-true}
      COGNEE_LOG_SEARCH_HISTORY: ${COGNEE_LOG_SEARCH_HISTORY:-false}
    ports:
      - "${SHADOW_BIND_ADDRESS:-127.0.0.1}:${COGNEE_MCP_PORT:-8001}:8000"
    volumes:
      - cognee_system:/cognee-storage/system
      - cognee_data:/cognee-storage/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: ${COGNEE_MEMORY_LIMIT:-4g}
    cpus: ${COGNEE_CPU_LIMIT:-2.0}

volumes:
  cognee_system:
  cognee_data:
