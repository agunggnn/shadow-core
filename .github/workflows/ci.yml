name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test "**/*.test.mjs"
      - run: npm pack --dry-run

  compose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: Validate initialized core project
        run: |
          node cli/bin/shadow.js init "$RUNNER_TEMP/shadow-core-smoke"
          cd "$RUNNER_TEMP/shadow-core-smoke"
          node "$GITHUB_WORKSPACE/cli/bin/shadow.js" doctor
